
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-auth-route
              uri: "http://localhost:8081"
              predicates:
                - "Path=/api/auth/**"

            - id: auth-service-users-route
              uri: "http://localhost:8081"
              predicates:
                - "Path=/api/users/**"

            - id: auth-service-admin-route
              uri: "http://localhost:8081"
              predicates:
                - "Path=/api/admin/**"

            - id: account-service-route
              uri: "http://localhost:8082"
              predicates:
                - "Path=/api/accounts/**"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
